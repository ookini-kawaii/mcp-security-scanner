name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install .
      - name: Compile
        run: python -m compileall -q scanner.py mcp_security_scanner tests
      - name: Unit and regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Benign precision gate
        run: python -B scanner.py benchmarks/benign --profile enforce --format json --no-report
      - name: Verify malicious recall
        shell: bash
        run: |
          set +e
          python -B scanner.py test_cases --profile enforce --format sarif --no-report > findings.sarif
          status=$?
          set -e
          test "$status" -eq 1

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build

