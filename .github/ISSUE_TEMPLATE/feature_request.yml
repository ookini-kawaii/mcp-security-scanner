name: 功能建议
description: 提议新的检测能力、输出格式或工程改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述实际使用场景、威胁或现有流程的不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、输入输出和兼容性影响。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，并确认没有重复建议。
          required: true
