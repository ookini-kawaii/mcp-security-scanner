name: Bug 报告
description: 报告可复现的扫描、规则、报告或 CLI 问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿在公开 Issue 中提交真实凭证、敏感样本或未修复漏洞的利用细节。
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v1.6.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 扫描与规则
        - CLI 与退出码
        - JSON/SARIF 报告
        - 基线与签名
        - MCP 运行时监控
        - 安装与兼容性
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请提供最小化、已脱敏的样本和完整命令。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: 操作系统、Python 版本、安装方式
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，并确认没有重复报告。
          required: true
        - label: 我已移除 Token、密钥、个人数据和敏感路径。
          required: true
