id: ATR-CRED-THEFT-001
name: Sensitive File Path Access in Description
description: >
  检测工具描述中包含敏感文件路径访问指令。
  攻击者通过description诱导Agent读取SSH密钥、AWS凭证等敏感文件。
severity: CRITICAL
category: credential_access
patterns:
  type: regex
  match:
    - '~/.ssh/id_rsa'
    - '~/.ssh/id_ed25519'
    - '~/.aws/credentials'
    - '~/.config/gcloud'
    - '~/.kube/config'
    - '/etc/shadow'
    - '/etc/passwd'
    - '\.env\b'
    - 'API_KEY'
    - 'SECRET_KEY'
    - 'PRIVATE_KEY'
mitre:
  tactic: TA0006
  technique: T1552.001
