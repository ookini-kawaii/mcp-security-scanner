[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-scanner"
version = "1.5.0"
description = "Context-aware static security scanner for MCP tool metadata and source files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ookini-kawaii"}]
keywords = ["mcp", "security", "agent", "supply-chain", "sarif"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0",
  "colorama>=0.4",
]

[project.urls]
Homepage = "https://github.com/ookini-kawaii/mcp-security-scanner"
Repository = "https://github.com/ookini-kawaii/mcp-security-scanner"
Issues = "https://github.com/ookini-kawaii/mcp-security-scanner/issues"

[project.scripts]
mcp-security-scanner = "scanner:main"

[tool.setuptools]
py-modules = ["scanner"]

[tool.setuptools.packages.find]
include = ["mcp_security_scanner*"]

[tool.setuptools.data-files]
"share/mcp-security-scanner/rules" = ["rules/*.yaml"]
